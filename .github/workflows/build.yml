name: Compilar Replay Source Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio do plugin
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (C++)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Descargar dependencias e SDK de libobs
        shell: pwsh
        run: |
          # Descarga o arquivo oficial completo con cabeceiras e CMake de OBS Studio
          gh release download 30.2.3 --repo obsproject/obs-studio --pattern "OBS-Studio-30.2.3-Full-x64.zip" --output obs-full.zip
          Expand-Archive -Path "obs-full.zip" -DestinationPath "$env:GITHUB_WORKSPACE/obs-studio"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Proxecto con CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/obs-studio"

      - name: Compilar Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Subir artefacto compilado (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-windows-x64
          path: |
            build/replay-source.dll
            build/Release/replay-source.dll
