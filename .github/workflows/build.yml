name: Compilar Replay Source Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Descargar código base de OBS Studio (Versión 32.2.2)
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 32.2.2
          submodules: recursive

      - name: Descargar código do teu plugin (Replay Source)
        uses: actions/checkout@v4
        with:
          path: plugins/replay-source

      - name: Inxectar o plugin no proxecto de OBS
        shell: pwsh
        run: |
          Add-Content -Path "plugins/CMakeLists.txt" -Value "`nadd_subdirectory(replay-source)"

      - name: Configurar CMake (OBS descargará os requisitos de Windows)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_UI=OFF `
            -DBUILD_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF

      - name: Compilar unicamente a DLL de Replay Source
        shell: pwsh
        run: |
          cmake --build build --config Release --target replay-source

      - name: Subir artefacto final (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-windows-x64
          path: build/plugins/replay-source/**/replay-source.dll
