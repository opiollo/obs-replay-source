name: Compilar Replay Source para OBS 33.0.1

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64 (OBS 33)
    runs-on: windows-2022

    steps:
      - name: Descargar código base de OBS Studio (Versión 33.0.0)
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 33.0.0
          submodules: recursive

      - name: Descargar o teu fork do plugin (Replay Source)
        uses: actions/checkout@v4
        with:
          path: plugins/replay-source

      - name: Inxectar o plugin e silenciar avisos obsoletos
        shell: pwsh
        run: |
          Add-Content -Path "plugins/CMakeLists.txt" -Value "`nadd_compile_options(/wd4996)`nadd_subdirectory(replay-source)"

      - name: Configurar CMake e Forzar Versión
        shell: pwsh
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag 33.0.1
          
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_UI=OFF `
            -DBUILD_BROWSER=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_WEBSOCKET=OFF `
            -DENABLE_WARNINGS_AS_ERRORS=OFF `
            -DOBS_VERSION_OVERRIDE="33.0.1"

      - name: Compilar a DLL de Replay Source
        shell: pwsh
        run: |
          cmake --build build --config Release --target replay-source

      - name: Empaquetar o plugin completo (DLL + data)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/obs-plugins/64bit"
          New-Item -ItemType Directory -Force -Path "package/data/obs-plugins/replay-source"
          
          $dllFile = Get-ChildItem -Path build/plugins/replay-source -Filter replay-source.dll -Recurse
          Copy-Item -Path $dllFile.FullName -Destination "package/obs-plugins/64bit/"
          
          if (Test-Path "plugins/replay-source/data") {
              Copy-Item -Path "plugins/replay-source/data\*" -Destination "package/data/obs-plugins/replay-source\" -Recurse
          }

      - name: Subir artefacto final (Paquete completo)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-obs33-paquete-completo
          path: package/
