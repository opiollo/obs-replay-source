name: Compilar Replay Source Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio do plugin
        uses: actions/checkout@v4

      - name: Activar compilador MSVC (C++)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar SDK oficial de OBS Studio
        uses: obsproject/setup-obs-studio@v1
        with:
          version: '30.2.3'

      - name: Configurar Proxecto con CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Subir artefacto compilado (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-windows-x64
          path: |
            build/replay-source.dll
            build/Release/replay-source.dll
