name: Compilar Replay Source Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio do plugin
        uses: actions/checkout@v4

      - name: Configurar CMake e Ninja
        uses: lukka/get-cmake@latest

      - name: Descargar precompilado de OBS Studio
        shell: pwsh
        run: |
          # Descarga o arquivo precompilado de OBS Studio para Windows
          $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile "obs-studio.zip"
          Expand-Archive -Path "obs-studio.zip" -DestinationPath "$env:GITHUB_WORKSPACE/obs-studio"

      - name: Configurar Proxecto con CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/obs-studio"

      - name: Compilar Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Subir artefacto compilado (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-windows-x64
          path: |
            build/Release/replay-source.dll
            build/Release/replay-source.pdb
