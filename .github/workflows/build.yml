name: Compilar Replay Source Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio do plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Descargar cabeceiras e CMake de OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: '30.2.3'
          path: obs-studio
          sparse-checkout: |
            libobs
            cmake

      - name: Activar compilador MSVC (C++)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configurar Proxecto con CMake
        shell: pwsh
        run: |
          cmake -B build -S plugin `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/obs-studio" `
            -DCMAKE_MODULE_PATH="$env:GITHUB_WORKSPACE/obs-studio/cmake/Modules" `
            -Dlibobs_INCLUDE_DIR="$env:GITHUB_WORKSPACE/obs-studio/libobs"

      - name: Compilar Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Subir artefacto compilado (.dll)
        uses: actions/upload-artifact@v4
        with:
          name: replay-source-windows-x64
          path: |
            build/replay-source.dll
            build/Release/replay-source.dll
