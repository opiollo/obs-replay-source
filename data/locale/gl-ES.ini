Buffering.ToolTip="Cando se activa, almacena datos de vídeo/audio para asegurar unha reprodución\no máis suave e precisa posible, mais a costa dun maior tempo de resposta.\nCando se usa o búfer cunha tarxeta capturadora de vídeo, recoméndase establecer\na tarxeta e o programa á mesma velocidade de fotogramas para un mellor resultado.\n\nCando se desactiva, garántese a reprodución co tempo de resposta máis baixo, mais a costa\nde perder precisión na reprodución dos fotogramas. Isto é ideal para o uso de webcams,\no cando desexa utilizar a xanela de vista previa de programa para xogar nunha consola.\n\nAutodetectar (por defecto) actívase se o dispositivo ten retardo e desáctivase\nse non ten ningún retardo."
